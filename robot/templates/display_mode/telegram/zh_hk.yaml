_version: "1.0"
locale: zh-hk
platform: telegram

mode_labels:
  user: "使用者模式"
  developer: "開發者模式"

mode_changed:
  user: "已切換為使用者模式。顯示簡潔進度與最終回覆。"
  developer: "已切換為開發者模式。顯示完整執行細節。"

mode_status:
  current_label: "目前模式：{label}"
  user_content: "顯示內容：簡潔進度與最終回覆"
  developer_content: "顯示內容：完整執行細節"
  usage: "可用：/mode user | /mode developer"

user_progress:
  processing: "🤖 {tag} 處理中 · {elapsed}"
  received: "📨 {tag} 已接收"

project_tag:
  with_branch: "專案[{name}/{branch}]"
  without_branch: "專案[{text}]"

recovered_run:
  user: "已恢復先前中斷的工作。"
  developer: "重新起動後已恢復中斷的運行。"

run_stopped:
  user: "⛔ {tag} 處理中止 · {elapsed}"
  developer: "關機期間代理運行已停止。"

output_text:
  cancelled: "處理中止"
  success: "處理完成"
  failure: "處理失敗"

wrapper_strip:
  project_prefix: "專案["
  completion_success: "處理完成"
  completion_failure: "處理失敗"
  completion_cancelled: "處理中止"
  icons:
    - "✅ "
    - "❌ "
    - "⛔ "

footer_prefixes:
  - "project: "
  - "provider: "
  - "model: "
  - "run_id: "
  - "profile: "
  - "回覆來自 model: "
  - "— "

footer_origin:
  template: "🚀 {origin}"

developer_templates:
  run_started_auto: |
    Auto-dev run started.
    goal: {goal}
    project: {project}
    path: {path}
    queue_waiting: {queue_waiting}
    elapsed: {elapsed}
    heartbeat: starting (first update within 1 second)

  run_started_provider: |
    Provider run started.
    goal: {goal}
    project: {project}
    path: {path}
    queue_waiting: {queue_waiting}
    elapsed: {elapsed}
    heartbeat: starting (first update within 1 second)

  run_queued_auto: |
    Auto-dev run queued.
    goal: {goal}
    project: {project}
    path: {path}
    queue_position: {position}
    elapsed: {elapsed}
    hint: use /queue to check waiting jobs

  run_queued_provider: |
    Provider run queued.
    goal: {goal}
    project: {project}
    path: {path}
    queue_position: {position}
    elapsed: {elapsed}
    hint: use /queue to check waiting jobs

  queue_waiting: |
    Queue waiting.
    kind: {kind}
    doing: {goal}
    project: {project}
    path: {path}
    phase: queue: waiting for worker
    queue_pending: {queue_pending}
    elapsed: {elapsed}

  worker_started: |
    Agent run started.
    kind: {kind}
    goal: {goal}
    project: {project}
    path: {path}
    provider: {provider}
    model/profile: {model}
    phase: {phase}
    queue_pending: {queue_pending}
    progress: {progress}
    elapsed: {elapsed}
    heartbeat: active

  heartbeat: |
    Heartbeat.
    kind: {kind}
    doing: {goal}
    project: {project}
    path: {path}
    phase: {phase}
    queue_pending: {queue_pending}
    progress: {progress}
    elapsed: {elapsed}

  run_finished: |
    Agent run finished.
    kind: {kind}
    goal: {goal}
    project: {project}
    path: {path}
    queue_pending: {queue_pending}
    status: {status}
    elapsed: {elapsed}