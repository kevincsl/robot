_version: "1.0"
locale: zh_TW
platform: telegram

#─────────────────────────────────────────
# 1. DISPLAY_MODE_LABELS
#─────────────────────────────────────────
mode_labels:
  user: "使用者模式"
  developer: "開發者模式"

#─────────────────────────────────────────
# 2. format_display_mode_changed
#─────────────────────────────────────────
mode_changed:
  user: "已切換為使用者模式。顯示簡潔進度與最終回覆。"
  developer: "已切換為開發者模式。顯示完整執行細節。"

#─────────────────────────────────────────
# 3. format_display_mode_status
#─────────────────────────────────────────
mode_status:
  current_label: "目前模式: {label}"
  user_content: "顯示內容: 簡潔進度與最終回覆"
  developer_content: "顯示內容: 完整執行細節"
  usage: "可用: /mode user | /mode developer"

#─────────────────────────────────────────
# 4. _format_user_progress
#─────────────────────────────────────────
user_progress:
  processing: "🤖 {tag} 處理中 · {elapsed}"
  received: "📨 {tag} 已接收"

#─────────────────────────────────────────
# 5. _format_project_tag
#─────────────────────────────────────────
project_tag:
  with_branch: "專案[{name}/{branch}]"
  without_branch: "專案[{text}]"

#─────────────────────────────────────────
# 6. format_recovered_run
#─────────────────────────────────────────
recovered_run:
  user: "已恢復先前中斷的工作。"
  developer: "Recovered interrupted run after restart."

#─────────────────────────────────────────
# 7. format_run_stopped
#─────────────────────────────────────────
run_stopped:
  user: "⛔ {tag} 處理中止 · {elapsed}"
  developer: "Agent run stopped during shutdown."

#─────────────────────────────────────────
# 8. format_output_text — completion messages
#─────────────────────────────────────────
output_text:
  cancelled: "處理中止"
  success: "處理完成"
  failure: "處理失敗"

#─────────────────────────────────────────
# 9. _strip_user_mode_completion_wrapper
#    （字串比對用，非格式化用途）
#─────────────────────────────────────────
wrapper_strip:
  project_prefix: "專案["
  completion_success: "處理完成"
  completion_failure: "處理失敗"
  completion_cancelled: "處理中止"
  icons:
    - "✅ "
    - "❌ "
    - "⛔ "

#─────────────────────────────────────────
# 10. _FOOTER_PREFIXES
#─────────────────────────────────────────
footer_prefixes:
  - "project: "
  - "provider: "
  - "model: "
  - "run_id: "
  - "profile: "
  - "回覆來自 model: "
  - "— "

#─────────────────────────────────────────
# 11. footer_origin（origin 行格式）
#─────────────────────────────────────────
footer_origin:
  template: "🚀 {origin}"

#─────────────────────────────────────────
# 12. developer_templates（完整輸出格式）
#─────────────────────────────────────────
developer_templates:
  run_started_auto: |
    Auto-dev run started.
    goal: {goal}
    project: {project}
    path: {path}
    queue_waiting: {queue_waiting}
    elapsed: {elapsed}
    heartbeat: starting (first update within 1 second)

  run_started_provider: |
    Provider run started.
    goal: {goal}
    project: {project}
    path: {path}
    queue_waiting: {queue_waiting}
    elapsed: {elapsed}
    heartbeat: starting (first update within 1 second)

  run_queued_auto: |
    Auto-dev run queued.
    goal: {goal}
    project: {project}
    path: {path}
    queue_position: {position}
    elapsed: {elapsed}
    hint: use /queue to check waiting jobs

  run_queued_provider: |
    Provider run queued.
    goal: {goal}
    project: {project}
    path: {path}
    queue_position: {position}
    elapsed: {elapsed}
    hint: use /queue to check waiting jobs

  queue_waiting: |
    Queue waiting.
    kind: {kind}
    doing: {goal}
    project: {project}
    path: {path}
    phase: queue: waiting for worker
    queue_pending: {queue_pending}
    elapsed: {elapsed}

  worker_started: |
    Agent run started.
    kind: {kind}
    goal: {goal}
    project: {project}
    path: {path}
    provider: {provider}
    model/profile: {model}
    phase: {phase}
    queue_pending: {queue_pending}
    progress: {progress}
    elapsed: {elapsed}
    heartbeat: active

  heartbeat: |
    Heartbeat.
    kind: {kind}
    doing: {goal}
    project: {project}
    path: {path}
    phase: {phase}
    queue_pending: {queue_pending}
    progress: {progress}
    elapsed: {elapsed}

  run_finished: |
    Agent run finished.
    kind: {kind}
    goal: {goal}
    project: {project}
    path: {path}
    queue_pending: {queue_pending}
    status: {status}
    elapsed: {elapsed}